<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark');
    }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagicBoo — Case Study | Haider Issa</title>
<meta name="description" content="Engineering case study: MagicBoo, an automated multi-sector site generation platform by Haider Issa.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
  }
</script>
<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body class="bg-white dark:bg-slate-950 text-slate-700 dark:text-slate-300 antialiased transition-colors duration-300 min-h-screen flex flex-col">

<header class="sticky top-0 z-50 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md">
  <nav class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-2 font-bold text-slate-900 dark:text-white">
      <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-sm">HI</span>
      <span class="hidden sm:inline">Haider Issa</span>
    </a>
    <button id="theme-toggle" aria-label="Toggle dark mode" class="w-9 h-9 flex items-center justify-center rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
      <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
    </button>
  </nav>
</header>

<main class="flex-1">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 sm:py-24">
    <a href="../index.html#projects" class="inline-flex items-center gap-2 text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:underline mb-8">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      Back to Portfolio
    </a>

    <div class="flex items-center gap-3 mb-4">
      <div class="w-12 h-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center">
        <i data-lucide="layout-template" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">MagicBoo</h1>
        <p class="text-sm text-slate-500 dark:text-slate-500">Automated Site Generation Platform</p>
      </div>
    </div>

    <div class="mt-12 flex flex-col items-center justify-center text-center py-16 px-6 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40">
      <i data-lucide="hammer" class="w-8 h-8 text-slate-400 dark:text-slate-600 mb-4"></i>
      <h2 class="font-bold text-lg text-slate-900 dark:text-white">Full case study coming soon</h2>
      <p class="mt-2 max-w-md text-sm text-slate-500 dark:text-slate-500">This page will detail the modular template engine and automated backend provisioning behind MagicBoo's multi-sector site generation.</p>
    </div>
  </div>
</main>

<footer class="border-t border-slate-200 dark:border-slate-800 py-8">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500 dark:text-slate-500">
    <p>&copy; <span id="year"></span> Haider Issa. All rights reserved.</p>
  </div>
</footer>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
